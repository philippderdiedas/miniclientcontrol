[package]
name = "miniclientcontrol"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
axum = { version = "0.8.1", features = ["multipart", "macros", "ws"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
chromiumoxide = "0.9.0"
futures = "0.3.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Fetching the managed wildcard certificate. hyper + tokio-rustls are already in
# the tree via axum/axum-server; webpki-roots is pure data. reqwest is NOT used:
# its `rustls` feature hard-wires aws-lc-rs, which needs a C toolchain the armv7
# cross image does not have.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "limit"] }
anyhow = "1.0"
mime_guess = "2.0"
tower = "0.5"
uuid = { version = "1.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
# topic_fs removed, I should use tokio::fs
chrono = { version = "0.4.39", features = ["serde"] }
# Already in the tree via chromiumoxide. Direct, so a guest-supplied URL is
# parsed rather than pattern-matched.
url = "2"
include_dir = "0.7"
urlencoding = "2.1"
base64 = "0.22"

# Cast: HTTPS listener. getDisplayMedia only works in a secure context, so the
# sender page cannot be served over plain HTTP from a LAN IP.
# rustls defaults to aws-lc-rs, which needs a C toolchain and does not
# cross-compile cleanly to armv7 -- pin the pure-Rust ring backend instead.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = "0.14"   # default features already select ring
rand = "0.9"
# svg only -- the default `image` feature drags in the whole image crate
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Webhook body templates. Pure Rust with serde as its only required dependency,
# so it cross-compiles to armv7 without a C toolchain -- unlike the aws-lc-rs
# path that keeps reqwest out of this tree. Verified with `cross build`.
minijinja = { version = "2", default-features = false, features = ["builtins", "serde"] }
# already in the tree via rustls/rcgen; used directly for PBKDF2 password hashing
ring = "0.17"
