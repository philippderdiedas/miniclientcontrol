<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assets</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    input, button, select { padding: .4rem; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .muted { color: #666; }
    a { color: #0a58ca; }
  </style>
</head>
<body>
  <h1>Asset Management</h1>
  <p><a href="/">Home</a> · <a href="/playlist.html">Playlist</a></p>

  <div class="row">
    <input id="fileInput" type="file" multiple />
    <button id="uploadBtn">Upload</button>
    <span id="uploadMsg" class="muted"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Filename</th>
        <th>MIME</th>
        <th>Duration(s)</th>
        <th>Preview</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="assetsBody"></tbody>
  </table>

  <script>
    // Rows are built with DOM calls rather than innerHTML: filenames come from
    // uploads and would otherwise be interpreted as markup.
    function cell(tr, text) {
      const td = document.createElement('td');
      if (text !== undefined) td.textContent = text;
      tr.appendChild(td);
      return td;
    }

    async function loadAssets() {
      const res = await fetch('/api/assets');
      const items = await res.json();
      const body = document.getElementById('assetsBody');
      body.textContent = '';

      for (const asset of items) {
        const tr = document.createElement('tr');
        cell(tr, asset.id);
        cell(tr, asset.filename);
        cell(tr, asset.mimetype);

        const durInput = document.createElement('input');
        durInput.id = `dur-${asset.id}`;
        durInput.type = 'number';
        durInput.min = '1';
        durInput.value = asset.duration ?? 10;
        durInput.style.width = '90px';
        cell(tr).appendChild(durInput);

        const link = document.createElement('a');
        link.href = `/uploads/${encodeURIComponent(asset.local_path)}`;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'open';
        cell(tr).appendChild(link);

        const actions = cell(tr);
        const saveBtn = document.createElement('button');
        saveBtn.textContent = 'Save';
        saveBtn.addEventListener('click', () => updateDuration(asset.id));
        const delBtn = document.createElement('button');
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => deleteAsset(asset.id));
        actions.append(saveBtn, ' ', delBtn);

        body.appendChild(tr);
      }
    }

    async function updateDuration(id) {
      const duration = Number(document.getElementById(`dur-${id}`).value);
      if (!Number.isFinite(duration) || duration < 1) {
        alert('Duration must be at least 1 second.');
        return;
      }
      await fetch(`/api/assets/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ duration })
      });
      await loadAssets();
    }

    async function deleteAsset(id) {
      if (!confirm('Delete this asset?')) return;
      await fetch(`/api/assets/${id}`, { method: 'DELETE' });
      await loadAssets();
    }

    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const input = document.getElementById('fileInput');
      if (!input.files.length) return;

      const fd = new FormData();
      const expected = input.files.length;
      for (const f of input.files) fd.append('file', f);

      const msg = document.getElementById('uploadMsg');
      msg.textContent = 'Uploading...';
      const res = await fetch('/api/assets', { method: 'POST', body: fd });

      // The server answers 200 with the list of files it actually stored, so a
      // partial failure must be reported from the body, not from res.ok.
      if (!res.ok) {
        msg.textContent = 'Upload failed';
      } else {
        const data = await res.json().catch(() => null);
        const stored = data && Array.isArray(data.uploaded) ? data.uploaded.length : 0;
        msg.textContent = stored === expected
          ? 'Upload complete'
          : `Upload incomplete: ${stored} of ${expected} stored`;
      }

      input.value = '';
      await loadAssets();
    });

    loadAssets();
  </script>
</body>
</html>
