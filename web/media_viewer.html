<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; }
    /* The object-fit modes fill the window exactly and never scroll. */
    body.fixed { width: 100vw; height: 100vh; overflow: hidden; }
    body.fixed #media { display: block; width: 100vw; height: 100vh; }
    /* `width`: full width, natural height. The document scrolls, and the scroll
       runtime the controller injects is what moves it -- which is why this page,
       unlike the PDF viewer, is not exempt from start_scrolling. */
    body.width #media { display: block; width: 100%; height: auto; }
    /* `height`: full height, natural width, centred. Wider than the screen is
       cut off at both sides rather than scrolled: the scroll runtime only moves
       vertically. A centred flex item overflows evenly in both directions. */
    body.height { width: 100vw; height: 100vh; overflow: hidden;
                  display: flex; justify-content: center; align-items: center; }
    body.height #media { display: block; height: 100vh; width: auto; max-width: none; flex: none; }
  </style>
</head>
<body>
  <script src="/autoscroll.js"></script>
  <script>
    // Chromium's own image and media documents are what this page replaces:
    // navigated to directly, an asset gets a layout no setting can reach and a
    // video gets a control bar nothing turns off.
    (() => {
      const params = new URLSearchParams(location.search);
      const asset = params.get('asset');
      const kind = params.get('kind') === 'video' ? 'video' : 'image';

      // An unknown fit falls back rather than drawing nothing, and `width` on a
      // video has no overflow worth scrolling -- both land on contain.
      const FITS = ['contain', 'cover', 'fill', 'none', 'width', 'height'];
      let fit = FITS.includes(params.get('fit')) ? params.get('fit') : 'contain';
      if (kind === 'video' && fit === 'width') fit = 'contain';

      // Validated here as well as on write: a row from an older binary, or one
      // edited by hand, must not paint an undefined colour.
      const bg = params.get('bg') || '';
      if (/^#([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(bg)) {
        document.documentElement.style.background = bg;
        document.body.style.background = bg;
      }

      if (!asset) return;

      const media = document.createElement(kind === 'video' ? 'video' : 'img');
      media.id = 'media';
      media.src = '/uploads/' + encodeURIComponent(asset);

      if (fit === 'width' || fit === 'height') {
        document.body.className = fit;
      } else {
        document.body.className = 'fixed';
        media.style.objectFit = fit;
      }

      // Set by `start()`: who started the video and when, for the tests and for
      // anybody reading the page's state over CDP.
      let started = null;

      // Unmuted first, muted only if the browser refuses. The controller starts
      // Chromium with --autoplay-policy=no-user-gesture-required, but a browser
      // started outside it may not have the flag, and a silent video is better
      // than a black screen.
      const play = () => {
        const attempt = media.play();
        if (attempt && attempt.catch) {
          attempt.catch((err) => {
            if (err && err.name === 'NotAllowedError') {
              media.muted = true;
              media.play().catch(() => {});
            }
          });
        }
      };

      if (kind === 'video') {
        // No `controls`: the bar is the complaint this page exists for. `loop`
        // unless the item counts plays (the counter below turns it off). No
        // `autoplay`: the video waits on its first frame for the controller,
        // which starts it the moment the item's clock starts -- otherwise it has
        // been playing for the seconds the readiness wait takes, and an item as
        // long as the video would show its beginning again at the end.
        media.controls = false;
        media.loop = true;
        media.playsInline = true;
        media.preload = 'auto';

        // Counting ends for an item that moves on after N plays. With a target
        // (set by the controller's reset) the video stops looping and restarts
        // itself until the last end, where it stays on its final frame.
        const adv = globalThis.__advanceCounter ? globalThis.__advanceCounter('video') : null;
        if (adv) {
          const reset = adv.reset.bind(adv);
          adv.reset = (count) => {
            reset(count);
            media.loop = !(adv.target > 0);
          };
          media.addEventListener('timeupdate', () => adv.alive(performance.now()));
          media.addEventListener('ended', () => {
            if (!adv.atEnd(performance.now(), 0)) {
              media.currentTime = 0;
              play();
            }
          });
          globalThis.__advance = adv;
        }
      }

      const start = (by) => {
        if (kind !== 'video') return false;
        started = { by, at: Math.round(performance.now()) };
        media.currentTime = 0;
        play();
        return true;
      };

      globalThis.__media = {
        start: () => start('controller'),
        state: () => ({
          kind,
          startedBy: started ? started.by : null,
          startedAt: started ? started.at : null,
        }),
      };

      // Nobody driving this page -- opened by hand, or a controller that never
      // gets to it -- must not leave it on a still frame for ever.
      if (kind === 'video') {
        setTimeout(() => { if (!started) start('fallback'); }, 20000);
      }

      document.body.append(media);
    })();
  </script>
</body>
</html>
