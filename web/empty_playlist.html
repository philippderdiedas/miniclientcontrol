<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Playlist Items</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #fff;
      color: #222;
    }
    .wrap {
      text-align: center;
      padding: 2rem;
      max-width: 720px;
    }
    img {
      width: min(320px, 70vw);
      height: auto;
      margin-bottom: 1.25rem;
    }
    h1 {
      margin: 0 0 .75rem;
      font-size: 1.9rem;
      font-weight: 700;
    }
    p {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img src="/logo.svg" alt="Logo" />
    <h1>No playlist items available</h1>
    <p>Please create and enable playlist items in Playlist Management.</p>
  </main>
</body>
</html>
