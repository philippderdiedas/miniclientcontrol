<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist</title>
  <style>
    :root {
      --line: #d8d8d8;
      --muted: #666;
      --accent: #0b6b3a;
      --accent-bg: #e8f5ee;
      --warn: #8a5a00;
      --warn-bg: #fff5e0;
      --err: #a11;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto 4rem;
      padding: 0 1rem;
      line-height: 1.45;
    }
    h1 { margin-bottom: .2rem; }
    nav { margin: 0 0 1rem; color: var(--muted); }
    .muted { color: var(--muted); }
    .err { color: var(--err); }

    /* Status bar stays put while scrolling a long playlist, so "what is on screen
       right now" is always answerable without scrolling back up. */
    .statusbar {
      position: sticky;
      top: 0;
      z-index: 5;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: .6rem 0;
      margin-bottom: 1rem;
      display: flex;
      gap: .8rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .dot {
      width: .6rem; height: .6rem; border-radius: 50%;
      background: var(--accent); display: inline-block; margin-right: .35rem;
    }

    /* Scopes everything below it to one playlist. Not sticky like the status
       bar -- it changes rarely, and two sticky bars would eat too much of a
       small display's viewport. */
    .playlistbar {
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: .8rem;
    }

    .block {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 1rem;
      background: #fff;
    }
    .block > summary {
      cursor: pointer;
      padding: .7rem .9rem;
      font-weight: 600;
      user-select: none;
    }
    .block .body { padding: 0 .9rem .9rem; }

    .card {
      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      border-radius: 8px;
      padding: .8rem .9rem;
      margin-bottom: .8rem;
      background: #fff;
    }
    .card.active { border-left-color: var(--accent); background: var(--accent-bg); }
    .card.dirty { border-left-color: var(--warn); background: var(--warn-bg); }
    .card-head {
      display: flex; align-items: baseline; gap: .6rem;
      flex-wrap: wrap; margin-bottom: .5rem;
    }
    .card-head .id { font-weight: 700; }
    .card-head .src {
      flex: 1 1 20ch; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted);
    }
    .badge {
      font-size: .78rem; padding: .1rem .45rem; border-radius: 999px;
      border: 1px solid currentColor;
    }
    .badge.live { color: var(--accent); }
    .badge.off { color: var(--muted); }
    .badge.pending { color: var(--warn); }

    .grid {
      display: flex; gap: .6rem 1rem; flex-wrap: wrap; align-items: flex-end;
    }
    /* Must beat `.grid { display: flex }`: a class selector outranks the user
       agent's `[hidden]` rule, so without this the scroll parameter rows stayed
       on screen (and editable) after being marked hidden. */
    [hidden] { display: none !important; }
    label.f { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); }
    label.f > span { margin-bottom: .15rem; }
    label.inline { display: flex; align-items: center; gap: .35rem; font-size: .9rem; color: #222; }
    input, select, button { padding: .35rem; font: inherit; }
    input[type=checkbox] { padding: 0; }
    button { cursor: pointer; border-radius: 5px; border: 1px solid #888; background: #f6f6f6; }
    button:hover:not(:disabled) { background: #ececec; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button.primary { border-color: #333; background: #333; color: #fff; }
    button.primary:hover:not(:disabled) { background: #111; }
    button.danger { border-color: #b55; color: #a11; }
    .actions { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; margin-top: .6rem; }
    .feedback { font-size: .85rem; }
    fieldset { border: 1px dashed var(--line); border-radius: 6px; margin: .6rem 0 0; padding: .5rem .7rem; }
    legend { font-size: .8rem; color: var(--muted); padding: 0 .3rem; }
  </style>
</head>
<body>
  <h1>Playlist</h1>
  <nav><a href="/admin.html">Verwaltung</a> · <a href="/assets.html">Assets</a></nav>

  <div class="playlistbar">
    <strong>Playlist</strong>
    <select id="playlistPick"></select>
    <button id="playlistNewBtn" type="button">Neu</button>
    <button id="playlistRenameBtn" type="button">Umbenennen</button>
    <button id="playlistDeleteBtn" type="button" class="danger">Löschen</button>
    <span class="feedback" id="playlistFeedback"></span>
  </div>

  <div class="statusbar">
    <strong id="nowPlaying">läuft: –</strong>
    <span id="overrideState" class="muted"></span>
    <span style="flex:1"></span>
    <button id="reloadBtn" type="button">Neu laden</button>
  </div>

  <details class="block" id="overrideBlock">
    <summary>Override – ein Inhalt dauerhaft anzeigen</summary>
    <div class="body">
      <p class="muted">
        Der Override hält die Playlist an und zeigt nur diesen Inhalt, bis er beendet wird.
      </p>
      <div class="grid">
        <label class="f"><span>Asset</span>
          <select id="ovAsset"><option value="">(keins)</option></select>
        </label>
        <label class="f"><span>oder URL</span>
          <input id="ovUrl" placeholder="https://..." style="width:280px" />
        </label>
      </div>
      <div id="ovScroll"></div>
      <div class="actions">
        <button type="button" class="primary" id="ovStart">Override starten</button>
        <button type="button" id="ovStop">Override beenden</button>
        <span class="feedback" id="ovFeedback"></span>
      </div>
    </div>
  </details>

  <details class="block" id="addBlock">
    <summary>Item hinzufügen</summary>
    <div class="body">
      <div class="grid">
        <label class="f"><span>Asset</span>
          <select id="addAsset"><option value="">(keins)</option></select>
        </label>
        <label class="f"><span>oder URL</span>
          <input id="addUrl" placeholder="https://..." style="width:280px" />
        </label>
        <label class="f"><span>Dauer (s)</span>
          <input id="addDuration" type="number" min="1" value="10" style="width:90px" />
        </label>
        <label class="inline"><input id="addEnabled" type="checkbox" checked /> Enabled</label>
        <label class="inline"><input id="addKeep" type="checkbox" /> Keep loaded</label>
        <label class="f"><span>Start</span>
          <input id="addStart" type="datetime-local" style="width:200px" />
        </label>
        <label class="f"><span>Ende</span>
          <input id="addEnd" type="datetime-local" style="width:200px" />
        </label>
      </div>
      <div id="addScroll"></div>
      <div class="actions">
        <button type="button" class="primary" id="addBtn">Hinzufügen</button>
        <span class="feedback" id="addFeedback"></span>
      </div>
    </div>
  </details>

  <div id="list"></div>
  <p class="muted" id="emptyHint" hidden>Noch keine Items.</p>
  <p class="muted" id="noPlaylistHint" hidden>Noch keine Playlist. Lege eine an, um Elemente hinzuzufügen.</p>

  <script>
    // Every node here is built with createElement/textContent. Filenames and URLs are
    // operator- and upload-supplied, so string-interpolated innerHTML would be an
    // injection sink.
    const el = (tag, props = {}, ...children) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(props)) {
        if (k === 'class') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k === 'style') node.style.cssText = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else if (v !== null && v !== undefined && v !== false) node[k] = v;
      }
      for (const c of children) if (c) node.append(c);
      return node;
    };

    const field = (labelText, input) =>
      el('label', { class: 'f' }, el('span', { text: labelText }), input);

    const num = (value, width, min = 0) =>
      el('input', { type: 'number', min: String(min), value: value ?? '', style: `width:${width}` });

    function flash(node, message, isError) {
      node.textContent = message;
      node.className = isError ? 'feedback err' : 'feedback';
      if (!isError) setTimeout(() => { if (node.textContent === message) node.textContent = ''; }, 2500);
    }

    async function readError(res, fallback) {
      try {
        const body = await res.json();
        if (body && body.error) return body.error;
      } catch (_) { /* not a JSON error body */ }
      return fallback;
    }

    // --- scroll config editor -------------------------------------------------
    // One builder for the add form, the override form and every card, so all three
    // stay in sync and every row carries its own values.
    function scrollEditor(initial) {
      const cfg = initial || { type: 'None' };
      const o = cfg.options || {};

      const mode = el('select', {},
        el('option', { value: 'none', text: 'None' }),
        el('option', { value: 'step', text: 'Step' }),
        el('option', { value: 'continuous', text: 'Continuous' }));
      mode.value = (cfg.type || 'None').toLowerCase();

      const stepPx = num(o.step_px ?? '', '110px', 1);
      stepPx.placeholder = 'Viewport';
      const stepTime = num(o.step_time ?? '', '130px', 1);
      stepTime.placeholder = 'leer = Sprung';
      const stepDelay = num(o.step_delay ?? 2000, '110px');
      const speed = el('input', { type: 'number', min: '0', step: '0.1', value: o.speed ?? 2.0, style: 'width:90px' });
      const topDelay = num(o.top_delay ?? 2000, '110px');
      const returnDelay = num(o.return_delay ?? 2000, '120px');

      const stepRow = el('div', { class: 'grid' },
        field('Step px', stepPx), field('Step time (ms)', stepTime), field('Step delay (ms)', stepDelay));
      const contRow = el('div', { class: 'grid' },
        field('Speed (px/frame)', speed), field('Top delay (ms)', topDelay), field('Return delay (ms)', returnDelay));

      const sync = () => {
        const active = mode.value;
        stepRow.hidden = active !== 'step';
        contRow.hidden = active !== 'continuous';
        // Disabled as well as hidden: a control that does not apply should not be
        // reachable by keyboard either, and it makes "None means none" explicit
        // rather than relying on read() to ignore the values.
        for (const row of [stepRow, contRow]) {
          for (const input of row.querySelectorAll('input')) input.disabled = row.hidden;
        }
      };
      mode.addEventListener('change', sync);
      sync();

      const root = el('fieldset', {},
        el('legend', { text: 'Scroll' }),
        el('div', { class: 'grid' }, field('Modus', mode)),
        stepRow, contRow);

      return {
        root,
        onInput(handler) { root.addEventListener('input', handler); root.addEventListener('change', handler); },
        read() {
          if (mode.value === 'none') return { type: 'None' };
          if (mode.value === 'step') {
            return {
              type: 'Step',
              options: {
                step_px: stepPx.value ? Number(stepPx.value) : null,
                step_time: stepTime.value ? Number(stepTime.value) : null,
                step_delay: Number(stepDelay.value || 2000),
              },
            };
          }
          return {
            type: 'Continuous',
            options: {
              speed: Number(speed.value || 2.0),
              top_delay: Number(topDelay.value || 2000),
              return_delay: Number(returnDelay.value || 2000),
            },
          };
        },
      };
    }

    // --- per-item overlay editor ---------------------------------------------
    // Content, a corner, and the text colour. Sizes and opacity come from the
    // global overlay in the admin page, so a display keeps one look across items
    // and this fieldset stays small enough to sit in every card. The colour is
    // the one exception, because one bright page in a dark playlist makes the
    // global white clock unreadable and nothing else can answer that.
    function overlayEditor(initial, assets) {
      const cfg = initial || {};

      const enabled = el('input', { type: 'checkbox' });
      enabled.checked = !!cfg.enabled;

      const text = el('input', { value: cfg.text || '', style: 'width:100%' });
      text.placeholder = 'z. B. Mehr Infos';

      const qrText = el('input', { value: cfg.qr_text || '', style: 'width:100%' });
      qrText.placeholder = 'URL für den QR-Code';
      const qrLabel = el('input', { value: cfg.qr_label || '', style: 'width:140px' });

      const image = el('select', {}, el('option', { value: '', text: '(kein Bild)' }));
      for (const a of assets || []) {
        if (!(a.mimetype || '').startsWith('image/')) continue;
        image.append(el('option', { value: String(a.id), text: `#${a.id} – ${a.filename}` }));
      }
      image.value = cfg.image_asset_id ? String(cfg.image_asset_id) : '';

      const position = el('select', {},
        el('option', { value: '', text: 'wie global (gleiche Box)' }),
        el('option', { value: 'bottom-right', text: 'unten rechts' }),
        el('option', { value: 'bottom-left', text: 'unten links' }),
        el('option', { value: 'bottom-center', text: 'unten mittig' }),
        el('option', { value: 'top-right', text: 'oben rechts' }),
        el('option', { value: 'top-left', text: 'oben links' }),
        el('option', { value: 'top-center', text: 'oben mittig' }));
      position.value = cfg.position || '';

      // A colour input has no empty state, so the checkbox is what expresses
      // "use the global colour" -- without it there is no way back once a colour
      // has been picked. Same shape as the admin page's QR choice `keiner`,
      // which is a UI value with no server-side counterpart.
      const ownColor = el('input', { type: 'checkbox' });
      ownColor.checked = !!cfg.color;
      const color = el('input', { type: 'color', value: cfg.color || '#000000' });
      const colorRow = el('label', { class: 'inline' }, ownColor,
        el('span', { text: 'eigene Textfarbe' }), color);

      const rows = el('div', {},
        el('div', { class: 'grid' }, field('Text', text)),
        el('div', { class: 'grid' }, field('QR-Code für', qrText), field('QR-Beschriftung', qrLabel)),
        el('div', { class: 'grid' }, field('Bild', image), field('Ecke', position)),
        colorRow);

      const syncColor = () => { color.disabled = !ownColor.checked || rows.hidden; };
      ownColor.addEventListener('change', syncColor);

      const sync = () => {
        rows.hidden = !enabled.checked;
        // Disabled as well as hidden, like the scroll editor: a control that does
        // not apply should not be reachable by keyboard either.
        for (const input of rows.querySelectorAll('input, select')) input.disabled = rows.hidden;
        syncColor();
      };
      enabled.addEventListener('change', sync);
      sync();

      const root = el('fieldset', {},
        el('legend', { text: 'Overlay (zusätzlich zum globalen)' }),
        el('label', { class: 'inline' }, enabled, el('span', { text: 'für dieses Item einblenden' })),
        rows);

      return {
        root,
        read() {
          return {
            enabled: enabled.checked,
            text: text.value,
            qr_text: qrText.value.trim(),
            qr_label: qrLabel.value,
            image_asset_id: image.value ? Number(image.value) : null,
            position: position.value,
            // Empty means "the global colour", which is what the server reads it as.
            color: ownColor.checked ? color.value : '',
          };
        },
      };
    }

    // --- date helpers ---------------------------------------------------------
    function toInputValue(value) {
      if (!value) return '';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function toIso(value) {
      if (!value) return null;
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? null : d.toISOString();
    }

    // --- playability ----------------------------------------------------------
    // Mirrors the browser loop's WHERE clause: is_enabled = 1 and inside the date
    // window. "Play now" on anything else is a no-op the loop logs and ignores, so the
    // button says why instead of appearing to do nothing.
    function playability(item) {
      if (!(item.enabled ?? item.is_enabled)) return { ok: false, why: 'deaktiviert' };
      const now = Date.now();
      if (item.start_date) {
        const start = new Date(item.start_date).getTime();
        if (!Number.isNaN(start) && now < start) return { ok: false, why: 'Startdatum liegt in der Zukunft' };
      }
      if (item.end_date) {
        const end = new Date(item.end_date).getTime();
        if (!Number.isNaN(end) && now > end) return { ok: false, why: 'Enddatum ist vorbei' };
      }
      return { ok: true, why: '' };
    }

    function sourceLabel(item) {
      if (item.url) return item.url;
      if (item.local_path) return `Asset #${item.asset_id} – ${item.local_path}`;
      if (item.asset_id) return `Asset #${item.asset_id} (fehlt!)`;
      return '(keine Quelle)';
    }

    // --- state ----------------------------------------------------------------
    let assets = [];
    let items = [];
    let currentItemId = null;
    const dirty = new Set();      // cards with unsaved edits, kept across reloads
    const cardNodes = new Map();  // id -> rendered card element

    // --- playlist selector ------------------------------------------------------
    // The selected playlist scopes everything below. Kept in the URL so a
    // reload, or a link an operator sends a colleague, lands on the same one.
    let currentPlaylist = null;

    function setPlaylistParam(id) {
      const params = new URLSearchParams(location.search);
      if (id) params.set('playlist', id);
      else params.delete('playlist');
      const query = params.toString();
      history.replaceState(null, '', location.pathname + (query ? `?${query}` : ''));
    }

    async function loadPlaylists() {
      const lists = await fetch('/api/playlists').then((r) => r.json()).catch(() => []);
      const pick = document.getElementById('playlistPick');
      pick.replaceChildren();
      for (const list of lists) {
        pick.append(el('option', {
          value: String(list.id),
          text: `${list.name} (${list.items})`,
        }));
      }
      const wanted = new URLSearchParams(location.search).get('playlist');
      currentPlaylist = (wanted && lists.some((l) => String(l.id) === wanted))
        ? wanted
        : (lists[0] ? String(lists[0].id) : null);
      if (currentPlaylist) pick.value = currentPlaylist;

      // An item form with nowhere to put the item is a form that produces a 400
      // for a reason the operator cannot see, so it is hidden rather than shown
      // disabled.
      const empty = lists.length === 0;
      document.getElementById('addBlock').hidden = empty;
      document.getElementById('list').hidden = empty;
      document.getElementById('noPlaylistHint').hidden = !empty;
      document.getElementById('playlistRenameBtn').disabled = empty;
      document.getElementById('playlistDeleteBtn').disabled = empty;

      return lists;
    }

    document.getElementById('playlistPick').addEventListener('change', async (e) => {
      currentPlaylist = e.target.value || null;
      setPlaylistParam(currentPlaylist);
      await loadPlaylist();
      await refreshStatus();
    });

    document.getElementById('playlistNewBtn').addEventListener('click', async () => {
      const feedback = document.getElementById('playlistFeedback');
      const name = prompt('Name der neuen Playlist:');
      if (name === null) return;
      const res = await fetch('/api/playlists', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      if (!res.ok) { flash(feedback, await readError(res, 'Anlegen fehlgeschlagen'), true); return; }
      const { id } = await res.json();
      setPlaylistParam(String(id));
      await loadPlaylists();
      flash(feedback, 'angelegt ✓');
      await loadPlaylist();
    });

    document.getElementById('playlistRenameBtn').addEventListener('click', async () => {
      const feedback = document.getElementById('playlistFeedback');
      if (!currentPlaylist) return;
      const pick = document.getElementById('playlistPick');
      const currentName = pick.selectedOptions[0] ? pick.selectedOptions[0].text.replace(/\s\(\d+\)$/, '') : '';
      const name = prompt('Neuer Name:', currentName);
      if (name === null) return;
      const res = await fetch(`/api/playlists/${currentPlaylist}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      if (!res.ok) { flash(feedback, await readError(res, 'Umbenennen fehlgeschlagen'), true); return; }
      flash(feedback, 'umbenannt ✓');
      await loadPlaylists();
    });

    document.getElementById('playlistDeleteBtn').addEventListener('click', async () => {
      const feedback = document.getElementById('playlistFeedback');
      if (!currentPlaylist) return;
      if (!confirm('Diese Playlist wirklich löschen?')) return;
      const res = await fetch(`/api/playlists/${currentPlaylist}`, { method: 'DELETE' });
      // The server counts the items and this is its own message -- do not
      // pre-empt it here, or the page would have to count them again.
      if (!res.ok) { flash(feedback, await readError(res, 'Löschen fehlgeschlagen'), true); return; }
      flash(feedback, 'gelöscht ✓');
      setPlaylistParam(null);
      await loadPlaylists();
      setPlaylistParam(currentPlaylist);
      await loadPlaylist();
    });

    async function loadAssets() {
      const res = await fetch('/api/assets');
      assets = res.ok ? await res.json() : [];
      for (const sel of [document.getElementById('addAsset'), document.getElementById('ovAsset')]) {
        const keep = sel.value;
        sel.textContent = '';
        sel.append(el('option', { value: '', text: '(keins)' }));
        for (const a of assets) sel.append(el('option', { value: String(a.id), text: `#${a.id} – ${a.filename}` }));
        sel.value = keep;
      }
    }

    function assetSelect(selectedId) {
      const sel = el('select', {});
      for (const a of assets) sel.append(el('option', { value: String(a.id), text: `#${a.id} – ${a.filename}` }));
      if (selectedId !== null && selectedId !== undefined) {
        sel.value = String(selectedId);
        // The asset behind this item was deleted: keep it selectable-looking rather
        // than silently snapping to a different asset on the next save.
        if (sel.value !== String(selectedId)) {
          sel.prepend(el('option', { value: String(selectedId), text: `#${selectedId} – (gelöscht)` }));
          sel.value = String(selectedId);
        }
      }
      return sel;
    }

    function buildCard(item, index, total) {
      const card = el('div', { class: 'card' });
      card.dataset.id = String(item.id);

      const liveBadge = el('span', { class: 'badge live', text: '▶ läuft' });
      const stateBadge = el('span', { class: 'badge off' });
      const dirtyBadge = el('span', { class: 'badge pending', text: 'ungespeichert', hidden: true });

      const head = el('div', { class: 'card-head' },
        el('span', { class: 'id', text: `#${item.id}` }),
        el('span', { class: 'src', text: sourceLabel(item), title: sourceLabel(item) }),
        liveBadge, stateBadge, dirtyBadge);
      card.append(head);

      // Source: same-kind swap only. A URL item gets a URL input, an asset item an
      // asset picker. The server rejects the other direction, so the UI never offers it.
      const isAsset = item.asset_id !== null && item.asset_id !== undefined;
      const urlInput = isAsset ? null : el('input', { value: item.url ?? '', style: 'width:min(420px, 100%)', placeholder: 'https://...' });
      const assetPicker = isAsset ? assetSelect(item.asset_id) : null;

      const duration = num(item.duration ?? item.asset_duration ?? 10, '90px', 1);
      const enabled = el('input', { type: 'checkbox', checked: !!(item.enabled ?? item.is_enabled) });
      const keep = el('input', { type: 'checkbox', checked: !!item.keep_loaded });
      const start = el('input', { type: 'datetime-local', value: toInputValue(item.start_date), style: 'width:200px' });
      const end = el('input', { type: 'datetime-local', value: toInputValue(item.end_date), style: 'width:200px' });

      card.append(el('div', { class: 'grid' },
        isAsset ? field('Asset', assetPicker) : field('URL', urlInput),
        field('Dauer (s)', duration),
        el('label', { class: 'inline' }, enabled, el('span', { text: 'Enabled' })),
        el('label', { class: 'inline' }, keep, el('span', { text: 'Keep loaded' })),
        field('Start', start),
        field('Ende', end)));

      const scroll = scrollEditor(item.scroll_config);
      card.append(scroll.root);

      const overlay = overlayEditor(item.overlay_config, assets);
      card.append(overlay.root);

      const feedback = el('span', { class: 'feedback' });
      const playBtn = el('button', { type: 'button', text: 'Play now' });
      const saveBtn = el('button', { type: 'button', class: 'primary', text: 'Speichern' });
      const upBtn = el('button', { type: 'button', text: '↑', title: 'nach oben', disabled: index === 0 });
      const downBtn = el('button', { type: 'button', text: '↓', title: 'nach unten', disabled: index === total - 1 });
      const delBtn = el('button', { type: 'button', class: 'danger', text: 'Löschen' });

      card.append(el('div', { class: 'actions' }, saveBtn, playBtn, upBtn, downBtn, delBtn, feedback));

      const markDirty = () => {
        dirty.add(item.id);
        card.classList.add('dirty');
        dirtyBadge.hidden = false;
      };
      card.addEventListener('input', markDirty);
      card.addEventListener('change', markDirty);

      saveBtn.addEventListener('click', async () => {
        const durationValue = Number(duration.value);
        if (!Number.isFinite(durationValue) || durationValue < 1) {
          flash(feedback, 'Dauer muss mindestens 1 Sekunde sein.', true);
          return;
        }
        const payload = {
          duration: durationValue,
          enabled: enabled.checked,
          keep_loaded: keep.checked,
          start_date: toIso(start.value),
          end_date: toIso(end.value),
          scroll_config: scroll.read(),
          overlay: overlay.read(),
        };
        if (isAsset) payload.asset_id = Number(assetPicker.value);
        else payload.url = urlInput.value.trim();

        saveBtn.disabled = true;
        const res = await fetch(`/api/playlist/${item.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        saveBtn.disabled = false;

        if (!res.ok) {
          flash(feedback, await readError(res, `Speichern fehlgeschlagen (HTTP ${res.status})`), true);
          return;
        }
        dirty.delete(item.id);
        card.classList.remove('dirty');
        dirtyBadge.hidden = true;
        flash(feedback, 'gespeichert ✓');
        await loadPlaylist();
      });

      playBtn.addEventListener('click', async () => {
        const res = await fetch('/api/control/current', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ item_id: item.id }),
        });
        flash(feedback, res.ok ? 'wird abgespielt…' : 'Play now fehlgeschlagen', !res.ok);
        setTimeout(refreshStatus, 700);
      });

      const move = async (direction) => {
        upBtn.disabled = downBtn.disabled = true;
        const res = await fetch(`/api/playlist/${item.id}/move`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ direction }),
        });
        if (!res.ok) flash(feedback, await readError(res, 'Verschieben fehlgeschlagen'), true);
        await loadPlaylist();
      };
      upBtn.addEventListener('click', () => move('up'));
      downBtn.addEventListener('click', () => move('down'));

      delBtn.addEventListener('click', async () => {
        if (!confirm(`Item #${item.id} löschen?`)) return;
        const res = await fetch(`/api/playlist/${item.id}`, { method: 'DELETE' });
        if (!res.ok) { flash(feedback, 'Löschen fehlgeschlagen', true); return; }
        dirty.delete(item.id);
        await loadPlaylist();
      });

      card._refresh = () => {
        const isLive = currentItemId === item.id;
        card.classList.toggle('active', isLive);
        liveBadge.hidden = !isLive;
        const play = playability(item);
        stateBadge.hidden = play.ok;
        stateBadge.textContent = play.why;
        playBtn.disabled = !play.ok;
        playBtn.title = play.ok ? '' : `Play now hat keine Wirkung: ${play.why}`;
      };
      card._refresh();
      if (dirty.has(item.id)) { card.classList.add('dirty'); dirtyBadge.hidden = false; }

      return card;
    }

    async function loadPlaylist() {
      const list = document.getElementById('list');
      // No playlist selected (none exist, or none picked yet): omitting
      // `playlist_id` would fetch every item across every playlist, which is
      // the legacy behaviour this page must never rely on.
      if (!currentPlaylist) {
        items = [];
        list.textContent = '';
        cardNodes.clear();
        document.getElementById('emptyHint').hidden = true;
        return;
      }
      const res = await fetch('/api/playlist?playlist_id=' + currentPlaylist);
      items = res.ok ? await res.json() : [];

      // Cards with unsaved edits are carried over instead of re-rendered, so a save or
      // reorder elsewhere on the page does not silently throw away typed-in values.
      const reused = new Map();
      for (const [id, node] of cardNodes) if (dirty.has(id)) reused.set(id, node);

      list.textContent = '';
      cardNodes.clear();
      items.forEach((item, i) => {
        const node = reused.get(item.id) || buildCard(item, i, items.length);
        cardNodes.set(item.id, node);
        list.append(node);
      });

      document.getElementById('emptyHint').hidden = items.length > 0;
      refreshCards();
    }

    function refreshCards() {
      for (const item of items) {
        const node = cardNodes.get(item.id);
        if (node && node._refresh) node._refresh();
      }
    }

    async function refreshStatus() {
      try {
        const [curRes, ovRes] = await Promise.all([
          fetch('/api/control/current'),
          fetch('/api/override'),
        ]);

        currentItemId = curRes.ok ? (await curRes.json()).item_id : null;
        const item = items.find((x) => x.id === currentItemId);
        document.getElementById('nowPlaying').textContent = currentItemId
          ? `▶ läuft: #${currentItemId} – ${item ? sourceLabel(item) : '…'}`
          : 'läuft: –';

        const ov = ovRes.ok ? await ovRes.json() : { active: false };
        const ovState = document.getElementById('overrideState');
        ovState.textContent = '';
        if (ov.active) {
          ovState.append(el('span', { class: 'dot' }));
          ovState.append(document.createTextNode(
            `Override aktiv: ${ov.url || (ov.asset_id ? `Asset #${ov.asset_id}` : '?')} – Playlist pausiert`));
        }
        refreshCards();
      } catch (_) {
        // Polling failure is transient (controller restarting); the next tick retries.
      }
    }

    // --- add form -------------------------------------------------------------
    const addScroll = scrollEditor(null);
    document.getElementById('addScroll').append(addScroll.root);

    document.getElementById('addBtn').addEventListener('click', async () => {
      const feedback = document.getElementById('addFeedback');
      const assetVal = document.getElementById('addAsset').value;
      const urlVal = document.getElementById('addUrl').value.trim();
      if (!currentPlaylist) { flash(feedback, 'Keine Playlist ausgewählt.', true); return; }
      if (!assetVal && !urlVal) { flash(feedback, 'Asset oder URL angeben.', true); return; }
      if (assetVal && urlVal) { flash(feedback, 'Nur Asset ODER URL, nicht beides.', true); return; }

      const payload = {
        asset_id: assetVal ? Number(assetVal) : null,
        url: urlVal || null,
        duration: Number(document.getElementById('addDuration').value || 10),
        enabled: document.getElementById('addEnabled').checked,
        keep_loaded: document.getElementById('addKeep').checked,
        start_date: toIso(document.getElementById('addStart').value),
        end_date: toIso(document.getElementById('addEnd').value),
        scroll_config: addScroll.read(),
        playlist_id: Number(currentPlaylist),
      };

      const res = await fetch('/api/playlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) { flash(feedback, await readError(res, 'Anlegen fehlgeschlagen'), true); return; }

      document.getElementById('addUrl').value = '';
      document.getElementById('addStart').value = '';
      document.getElementById('addEnd').value = '';
      flash(feedback, 'hinzugefügt ✓');
      await loadPlaylist();
    });

    // --- override -------------------------------------------------------------
    const ovScroll = scrollEditor(null);
    document.getElementById('ovScroll').append(ovScroll.root);

    document.getElementById('ovStart').addEventListener('click', async () => {
      const feedback = document.getElementById('ovFeedback');
      const assetVal = document.getElementById('ovAsset').value;
      const urlVal = document.getElementById('ovUrl').value.trim();
      if (!assetVal && !urlVal) { flash(feedback, 'Asset oder URL angeben.', true); return; }

      const res = await fetch('/api/override', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          asset_id: assetVal ? Number(assetVal) : null,
          url: urlVal || null,
          scroll_config: ovScroll.read(),
        }),
      });
      flash(feedback, res.ok ? 'Override aktiv' : await readError(res, 'Override fehlgeschlagen'), !res.ok);
      await refreshStatus();
    });

    document.getElementById('ovStop').addEventListener('click', async () => {
      const feedback = document.getElementById('ovFeedback');
      const res = await fetch('/api/override', { method: 'DELETE' });
      flash(feedback, res.ok ? 'Override beendet' : 'Beenden fehlgeschlagen', !res.ok);
      await refreshStatus();
    });

    document.getElementById('reloadBtn').addEventListener('click', async () => {
      await loadPlaylists();
      await loadAssets();
      await loadPlaylist();
      await refreshStatus();
    });

    (async function init() {
      await loadPlaylists();
      await loadAssets();
      await loadPlaylist();
      await refreshStatus();
      setInterval(refreshStatus, 2000);
    })();
  </script>
</body>
</html>
