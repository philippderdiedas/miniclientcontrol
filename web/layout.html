<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Layout</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #grid { display: grid; width: 100vw; height: 100vh;
            grid-template-columns: repeat(24, 1fr); grid-template-rows: repeat(24, 1fr); }
    #grid iframe { border: 0; width: 100%; height: 100%; background: #fff; }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script>
    // One iframe per widget, placed on the 24x24 grid. The frame's `name` is its
    // widget index: the controller finds a widget's frame by it to apply that
    // widget's scroll mode (src/frames.rs).
    (async () => {
      const item = new URLSearchParams(location.search).get('item');
      const res = await fetch(`/api/layout/${encodeURIComponent(item)}`);
      if (!res.ok) return;
      const { widgets, background } = await res.json();
      // The colour behind and between the widgets; black when unset.
      if (background) document.body.style.background = background;
      const grid = document.getElementById('grid');
      widgets.forEach((w, i) => {
        const frame = document.createElement('iframe');
        frame.name = `widget-${i}`;
        frame.src = w.src;
        frame.style.gridColumn = `${w.x + 1} / span ${w.w}`;
        frame.style.gridRow = `${w.y + 1} / span ${w.h}`;
        frame.allow = 'autoplay; fullscreen';
        // Scroll each widget with its own mode. A same-origin frame (an asset
        // viewer on this host) is driven directly; a cross-site one gets the
        // runtime from the controller (src/frames.rs) and is told by postMessage,
        // which reaches it whatever its origin. Repeated so a late-installed
        // runtime still hears it.
        const apply = () => {
          try {
            const doc = frame.contentWindow.document;
            if (!doc.getElementById('__as')) {
              const s = doc.createElement('script');
              s.id = '__as';
              s.src = '/autoscroll.js';
              doc.head.appendChild(s);
            }
            frame.contentWindow.postMessage({ __asCmd: 'apply', payload: w.scroll }, '*');
          } catch (_) {
            // Cross-origin: cannot touch its document, only message it.
            frame.contentWindow.postMessage({ __asCmd: 'apply', payload: w.scroll }, '*');
          }
        };
        frame.addEventListener('load', () => {
          let tries = 0;
          const timer = setInterval(() => { apply(); if (++tries >= 6) clearInterval(timer); }, 800);
        });
        grid.append(frame);
      });
    })();
  </script>
</body>
</html>
